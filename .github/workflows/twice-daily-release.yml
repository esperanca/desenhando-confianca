name: Twice daily release

on:
  workflow_dispatch:
  schedule:
    # 09:00 and 18:00 in Brasília time (UTC-3).
    - cron: "0 12,21 * * *"

permissions:
  contents: write

concurrency:
  group: twice-daily-release
  cancel-in-progress: false

jobs:
  release:
    name: Release pending changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect pending commits and next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          last_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          if [[ -z "$last_tag" ]]; then
            commits="$(git rev-list --count HEAD)"
            next_tag="v0.1.0"
          else
            commits="$(git rev-list --count "${last_tag}..HEAD")"
            version="${last_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"

          if [[ "$commits" == "0" ]]; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração desde ${last_tag}."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Serão lançados ${commits} commit(s) em ${next_tag}."
          fi

      - name: Setup Node.js
        if: steps.version.outputs.pending == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.pending == 'true'
        run: npm ci

      - name: Create release tag before build
        if: steps.version.outputs.pending == 'true'
        run: |
          git tag -a "${{ steps.version.outputs.next_tag }}" -m "Release ${{ steps.version.outputs.next_tag }}"

      - name: Verify site
        if: steps.version.outputs.pending == 'true'
        run: npm run verify

      - name: Deploy public build to Cloudflare Pages
        if: steps.version.outputs.pending == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name desenhando-confianca

      - name: Push release tag
        if: steps.version.outputs.pending == 'true'
        run: git push origin "${{ steps.version.outputs.next_tag }}"