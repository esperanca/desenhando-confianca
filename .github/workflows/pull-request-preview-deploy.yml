name: Deploy pull request preview

on:
  workflow_run:
    workflows: [Build pull request preview]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy preview to Cloudflare Pages
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve pull request from workflow run
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let pull = run.pull_requests?.[0];

            if (!pull) {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              pull = response.data.find((candidate) =>
                candidate.state === 'open' && candidate.base.ref === context.payload.repository.default_branch
              );
            }

            if (!pull) {
              core.setFailed(`Nenhuma pull request aberta encontrada para ${run.head_sha}.`);
              return;
            }

            core.setOutput('pr_number', pull.number);
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('branch', `pr-${pull.number}`);

      - name: Download verified public build
        uses: actions/download-artifact@v4
        with:
          name: preview-site-${{ steps.preview.outputs.pr_number }}
          path: preview-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f preview-artifact/index.html

          if find preview-artifact -type l -print -quit | grep -q .; then
            echo 'O build contém links simbólicos, que não são permitidos no preview.' >&2
            exit 1
          fi

          for reserved in _worker.js _routes.json functions; do
            if find preview-artifact -name "$reserved" -print -quit | grep -q .; then
              echo "O build contém o recurso executável reservado ${reserved}." >&2
              exit 1
            fi
          done

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler pages deploy preview-artifact \
            --project-name desenhando-confianca \
            --branch "${{ steps.preview.outputs.branch }}" \
            --commit-hash "${{ steps.preview.outputs.head_sha }}" \
            --commit-dirty=false

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.preview.outputs.pr_number }}
          PREVIEW_URL: https://${{ steps.preview.outputs.branch }}.desenhando-confianca.pages.dev
          HEAD_SHA: ${{ steps.preview.outputs.head_sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const shortSha = process.env.HEAD_SHA.slice(0, 7);
            const body = `${marker}\n✅ Preview publicado para \`${shortSha}\`:\n\n${process.env.PREVIEW_URL}`;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
