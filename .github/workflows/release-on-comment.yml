name: Prepare release from PR comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Lê o comando e confere o autor. Não faz checkout de código do PR.
  command:
    name: Read release command
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/release ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.parse.outputs.run }}
      version: ${{ steps.parse.outputs.version }}
      summary: ${{ steps.parse.outputs.summary }}
      head_ref: ${{ steps.parse.outputs.head_ref }}
      head_sha: ${{ steps.parse.outputs.head_sha }}
    steps:
      - name: Check commenter and read release command
        id: parse
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.comment.user.login }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          permission="$(gh api "repos/$REPO/collaborators/$LOGIN/permission" --jq '.permission')"
          if [[ "$permission" != "admin" ]]; then
            echo "Comentário ignorado: $LOGIN não é administrador do repositório."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          first_line="${COMMENT%%$'\n'*}"
          first_line="${first_line%$'\r'}"
          read -r _ version summary <<< "$first_line"
          summary="${summary:-Release $version}"

          pr_json="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          if [[ "$(jq -r '.state' <<< "$pr_json")" != "open" ]]; then
            echo "::error::O pull request não está aberto."
            exit 1
          fi

          if [[ "$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")" != "$REPO" ]]; then
            echo "::error::A branch do PR vem de um fork. O workflow só pode gravar em branches do próprio repositório."
            exit 1
          fi

          echo "Release $version solicitada por $LOGIN no PR #$PR_NUMBER."
          {
            echo "run=true"
            echo "version=$version"
            echo "summary=$summary"
            echo "head_ref=$(jq -r '.head.ref' <<< "$pr_json")"
            echo "head_sha=$(jq -r '.head.sha' <<< "$pr_json")"
          } >> "$GITHUB_OUTPUT"

  # Verifica o código do PR sem permissão de escrita e sem secrets.
  verify:
    name: Verify pull request code
    needs: command
    if: needs.command.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.command.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate requested version
        env:
          VERSION: ${{ needs.command.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: $VERSION. Use o formato vX.Y.Z."
            exit 1
          fi

          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::A tag $VERSION já existe. Se ela veio de um /release anterior neste PR, remova-a antes de pedir de novo."
            exit 1
          fi

          last_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [[ -n "$last_tag" ]]; then
            highest="$(printf '%s\n%s\n' "${last_tag#v}" "${VERSION#v}" | sort -V | tail -n 1)"
            if [[ "$highest" != "${VERSION#v}" ]]; then
              echo "::error::$VERSION não é maior que a última versão ($last_tag)."
              exit 1
            fi
          fi

      - name: Verify site
        run: npm run verify

  # Escreve versão, commit e tag. Não executa código do PR e não instala dependências.
  release:
    name: Write release to pull request
    needs: [command, verify]
    if: needs.command.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.command.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write version to package files without running scripts
        env:
          VERSION: ${{ needs.command.outputs.version }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          if [[ "$current" != "${VERSION#v}" ]]; then
            npm version "${VERSION#v}" --no-git-tag-version --ignore-scripts
          else
            echo "package.json já está em ${VERSION#v}."
          fi

      - name: Commit version, create tag and push
        env:
          VERSION: ${{ needs.command.outputs.version }}
          SUMMARY: ${{ needs.command.outputs.summary }}
          HEAD_REF: ${{ needs.command.outputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::A tag $VERSION foi criada enquanto o workflow rodava."
            exit 1
          fi

          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Prepara versão ${VERSION#v}"
          fi

          git tag -a "$VERSION" -m "$SUMMARY"

          # Push atômico: a tag e a branch são enviadas juntas, ou nenhuma delas é.
          # Se a branch tiver recebido commits depois da verificação, o push inteiro falha.
          git push --atomic origin "refs/tags/$VERSION" "HEAD:refs/heads/$HEAD_REF"

      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          VERSION: ${{ needs.command.outputs.version }}
        run: |
          set -euo pipefail
          gh issue comment "$PR_NUMBER" --repo "$REPO" --body "Versão $VERSION preparada neste PR. Ao fazer o merge (commit de merge, sem squash), a Cloudflare publica em produção."

      - name: Report failure on pull request
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          VERSION: ${{ needs.command.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUMBER" --repo "$REPO" --body "Não consegui preparar a release $VERSION. Veja o log: $RUN_URL"

  # Avisa no PR quando a verificação falha. Não faz checkout e não executa código do PR.
  report-verify-failure:
    name: Report verification failure
    needs: [command, verify]
    if: always() && needs.command.outputs.run == 'true' && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          VERSION: ${{ needs.command.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUMBER" --repo "$REPO" --body "A verificação do PR falhou, então a release $VERSION não foi preparada. Veja o log: $RUN_URL"
